{% extends "base.html" %}

{% block title %}Error {{ error_code }} – Personal Shopping Agent{% endblock %}

{% block content %}
<div class="container py-5 text-center my-auto">
    <div class="card border-0 shadow-sm rounded-4 p-5 max-w-md mx-auto bg-white">
        <div class="mb-3">
            <span class="badge bg-danger-subtle text-danger display-4 p-3 rounded-circle">
                <i class="bi bi-exclamation-triangle"></i>
            </span>
        </div>
        <h1 class="display-5 fw-bold text-dark mb-2">{{ error_code }}</h1>
        <h4 class="fw-semibold text-secondary mb-3">{{ title }}</h4>
        <p class="text-muted mb-4">
            {{ message }}
        </p>
        <div class="d-flex justify-content-center gap-2">
            <a href="{{ url_for('index') }}" class="btn btn-primary rounded-pill px-4 fw-semibold">
                <i class="bi bi-house me-1"></i> Return to Homepage
            </a>
            <a href="javascript:history.back()" class="btn btn-outline-secondary rounded-pill px-4">
                <i class="bi bi-arrow-left me-1"></i> Go Back
            </a>
        </div>
    </div>
</div>
{% endblock %}
